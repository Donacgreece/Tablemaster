<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αγορά Άδειας</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            padding-bottom: 20px;
        }

        footer {
            background-color: #f1f1f1;
            color: #333;
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
            width: 100%;
        }

        footer p {
            margin: 0;
            font-size: 0.9rem;
        }

        footer p strong {
            font-weight: bold;
            color: #007bff;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">TableMaster</a>
    </nav>

    <div class="container text-center mt-5">
        <h1>Η άδεια δεν είναι έγκυρη ή δεν βρέθηκε</h1>
        <p>Παρακαλώ αγοράστε μια έγκυρη άδεια για να συνεχίσετε τη χρήση της εφαρμογής.</p>
        <a href="https://tablemaster.gr" class="btn btn-primary">Αγορά Άδειας</a>
    </div>

    <footer>
        <p>© 2024 TableMaster - Απλοποιούμε την επιτυχία σας</p>
    </footer>
</body>
</html>
