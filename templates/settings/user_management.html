<div class="tab-pane fade {% if request.args.get('tab') == 'user-management' %}show active{% endif %}" id="user-management">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            Διαχείριση Χρηστών
            <button class="btn btn-info btn-sm" data-toggle="modal" data-target="#addUserModal">
                <i class="fas fa-user-plus"></i> Προσθήκη Χρήστη
            </button>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Όνομα</th>
                        <th>Επώνυμο</th>
                        <th>Ρόλος</th>
                        <th>Ενέργειες</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                        {% if user.id != 1 or session.get('user_id') == 1 %}
                            <tr>
                                <td>{{ user.first_name }}</td>
                                <td>{{ user.last_name }}</td>
                                <td>{{ user.role }}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" data-toggle="modal" data-target="#editUserModal{{ user.id }}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    {% if user.id != 1 and user.id != session.get('user_id') %}
                                        <button class="btn btn-danger btn-sm" data-toggle="modal" data-target="#deleteUserModal{{ user.id }}">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    {% endif %}
                                </td>
                            </tr>
                        {% endif %}
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
