<div class="tab-pane fade {% if request.args.get('tab') == 'product-management' %}show active{% endif %}" id="product-management">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            Διαχείριση Προϊόντων
            <div>
                <!-- Κουμπί για αποστολή αρχείου Excel -->
                <button class="btn btn-success btn-sm" data-toggle="modal" data-target="#uploadExcelModal" title="Ανέβασμα Excel">
                    <i class="fas fa-upload"></i>
                </button>
                <button class="btn btn-info btn-sm" data-toggle="modal" data-target="#addCategoryModal">
                    <i class="fas fa-plus"></i> Προσθήκη Κατηγορίας
                </button>
                <button class="btn btn-info btn-sm" data-toggle="modal" data-target="#addProductModal">
                    <i class="fas fa-plus"></i> Προσθήκη Προϊόντος
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="accordion" id="categoriesAccordion">
                {% for category in categories %}
                <div class="card mb-2">
                    <!-- Κατηγορία -->
                    {% include 'partials/category_card.html' %}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

{% include 'modals/upload_excel_modal.html' %}
