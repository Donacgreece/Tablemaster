<div class="tab-pane fade {% if request.args.get('tab') == 'printer-management' %}show active{% endif %}" id="printer-management">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            Διαχείριση Εκτυπωτών
            <button class="btn btn-info btn-sm" data-toggle="modal" data-target="#addPrinterModal">
                <i class="fas fa-plus"></i> Προσθήκη Εκτυπωτή
            </button>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Όνομα Εκτυπωτή</th>
                        <th>IP Διεύθυνση</th>
                        <th>Ενέργειες</th>
                    </tr>
                </thead>
                <tbody>
                    {% for printer in printers %}
                    <tr>
                        <td>{{ printer.name }}</td>
                        <td>{{ printer.ip_address }}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" data-toggle="modal" data-target="#editPrinterModal{{ printer.id }}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" data-toggle="modal" data-target="#deletePrinterModal{{ printer.id }}">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                    <!-- Επεξεργασία Εκτυπωτή -->
                    {% include 'modals/edit_printer.html' %}
                    <!-- Διαγραφή Εκτυπωτή -->
                    {% include 'modals/delete_printer.html' %}
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
