<div class="card-header d-flex justify-content-between align-items-center bg-light" id="heading{{ category.id }}">
    <h5 class="mb-0">
        <button class="btn btn-link text-dark font-weight-bold" type="button" data-toggle="collapse" data-target="#collapse{{ category.id }}" aria-expanded="true" aria-controls="collapse{{ category.id }}">
            {{ category.name }}
        </button>
    </h5>
    <div>
        <button class="btn btn-warning btn-sm" data-toggle="modal" data-target="#editCategoryModal{{ category.id }}"><i class="fas fa-edit"></i></button>
        <button class="btn btn-danger btn-sm" data-toggle="modal" data-target="#deleteCategoryModal{{ category.id }}"><i class="fas fa-trash-alt"></i></button>
    </div>
</div>

<div id="collapse{{ category.id }}" class="collapse" aria-labelledby="heading{{ category.id }}" data-parent="#categoriesAccordion">
    <div class="card-body">
        {% if category.products|length > 0 %}
        <ul class="list-group">
            {% for product in category.products %}
            {% include 'partials/product_list.html' %}
            {% endfor %}
        </ul>
        {% else %}
        <p class="text-muted">Δεν υπάρχουν προϊόντα σε αυτή την κατηγορία.</p>
        {% endif %}
    </div>
</div>
