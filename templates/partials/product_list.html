<li class="list-group-item d-flex justify-content-between align-items-center">
    {{ product.name }} ({{ product.price }} €)
    <div>
        <button class="btn btn-sm btn-warning" data-toggle="modal" data-target="#editProductModal{{ product.id }}"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-danger" data-toggle="modal" data-target="#deleteProductModal{{ product.id }}"><i class="fas fa-trash-alt"></i></button>
    </div>
</li>
