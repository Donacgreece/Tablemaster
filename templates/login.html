<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Είσοδος - TableMaster</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="header">TableMaster</div>
        <form method="POST" action="/login">
            <div class="input-group">
                <input type="password" class="form-control" id="pin" name="pin" placeholder="Εισάγετε το PIN σας" required>
            </div>
            <button type="submit" class="btn btn-primary">Είσοδος</button>
        </form>
    </div>
</body>
</html>
