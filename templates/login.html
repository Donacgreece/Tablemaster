<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Είσοδος - TableMaster</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center; /* Οριζόντια κεντραρισμένο */
            align-items: center; /* Κάθετα κεντραρισμένο */
            background: linear-gradient(120deg, #f1f1f1, #e2e2e2);
            overflow: hidden; /* Αποφυγή scroll */
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
            margin-top: -60px; /* Μετακίνηση λίγο ακόμα πιο πάνω */
        }

        .login-card .header {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .form-control {
            border-radius: 15px;
            height: 50px;
        }

        .btn-primary {
            width: 100%;
            border-radius: 25px;
            padding: 0.75rem;
            font-size: 1rem;
            background: #17a2b8; /* Χρώμα από το κουμπί "Αποθήκευση" */
            border: none;
        }

        .btn-primary:hover {
            background: #138496; /* Hover χρώμα */
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">TableMaster</div>
        <form method="POST" action="/login">
            <div class="input-group">
                <input type="password" class="form-control" id="pin" name="pin" placeholder="Εισάγετε το PIN σας" required>
            </div>
            <button type="submit" class="btn btn-primary">Είσοδος</button>
        </form>
    </div>
</body>
</html>
