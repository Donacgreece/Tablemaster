<div class="modal fade" id="editPrinterModal{{ printer.id }}" tabindex="-1" aria-labelledby="editPrinterModalLabel{{ printer.id }}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editPrinterModalLabel{{ printer.id }}">Επεξεργασία Εκτυπωτή</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form method="POST" action="{{ url_for('edit_printer', printer_id=printer.id) }}">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="name{{ printer.id }}">Όνομα Εκτυπωτή:</label>
                        <input type="text" class="form-control" id="name{{ printer.id }}" name="name" value="{{ printer.name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="ip_address{{ printer.id }}">IP Διεύθυνση:</label>
                        <input type="text" class="form-control" id="ip_address{{ printer.id }}" name="ip_address" value="{{ printer.ip_address }}" required>
                    </div>
                    <div class="form-group">
                        <label>Κατηγορίες για Εκτύπωση:</label>
                        <div class="row">
                            {% for category in categories %}
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="category{{ category.id }}_printer{{ printer.id }}" name="categories" value="{{ category.id }}"
                                    {% if category.id in printer_categories[printer.id] %}checked{% endif %}>
                                    <label class="form-check-label" for="category{{ category.id }}_printer{{ printer.id }}">
                                        {{ category.name }}
                                    </label>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Ακύρωση</button>
                    <button type="submit" class="btn btn-success">Αποθήκευση Αλλαγών</button>
                </div>
            </form>
        </div>
    </div>
</div>
