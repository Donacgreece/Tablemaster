<div class="modal fade" id="editProductModal{{ product.id }}" tabindex="-1" aria-labelledby="editProductModalLabel{{ product.id }}" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editProductModalLabel{{ product.id }}">Επεξεργασία Προϊόντος</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}?tab=product-management">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="product_name{{ product.id }}">Όνομα Προϊόντος</label>
                        <input type="text" class="form-control" id="product_name{{ product.id }}" name="product_name" value="{{ product.name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="product_price{{ product.id }}">Τιμή</label>
                        <input type="number" step="0.01" class="form-control" id="product_price{{ product.id }}" name="product_price" value="{{ product.price }}" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Ακύρωση</button>
                    <button type="submit" class="btn btn-success">Αποθήκευση Αλλαγών</button>
                </div>
            </form>
        </div>
    </div>
</div>
