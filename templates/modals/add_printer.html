<div class="modal fade" id="addPrinterModal" tabindex="-1" aria-labelledby="addPrinterModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="addPrinterModalLabel">Προσθήκη Εκτυπωτή</h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form method="POST" action="{{ url_for('add_printer') }}?tab=printer-management">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="name">Όνομα Εκτυπωτή:</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="ip_address">IP Διεύθυνση:</label>
                        <input type="text" class="form-control" id="ip_address" name="ip_address" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Ακύρωση</button>
                    <button type="submit" class="btn btn-success">Προσθήκη Εκτυπωτή</button>
                </div>
            </form>
        </div>
    </div>
</div>
